<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍜 หารกัน - ค่าอาหาร</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="food-icon.png?v=1" type="image/png">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <div class="container">
        <h1>🍜 หารค่าอาหาร (แบบแยกบิล)</h1>
        
        <!-- 1. รายชื่อคนกิน -->
        <div class="card">
            <h3>👥 1. ใครไปกินบ้าง?</h3>
            <div id="peopleList"></div>
            <button class="btn-add" onclick="addPerson()">+ เพิ่มคนกิน</button>
        </div>

        <!-- 2. บิลร้านอาหาร -->
        <div id="billsContainer"></div>
        <button class="btn-main" onclick="addBill()">+ เพิ่มบิลร้านอาหาร</button>

        <!-- 3. ข้อมูลบัญชีรับเงิน -->
        <div class="card" style="margin-top: 20px;">
            <h3>💳 3. บัญชีคนสำรองจ่าย</h3>
            <p style="font-size: 13px; color: #888;">ใส่ข้อมูลเพื่อให้เพื่อนโอนเงินคืน (เพิ่มได้ตามจำนวนคนที่ออกเงินไปก่อน)</p>
            <div id="bankAccountsList"></div>
            <button class="btn-add" onclick="addBankAccount()">+ เพิ่มบัญชีรับเงิน</button>
        </div>

        <!-- ปุ่มคำนวณ -->
        <button class="btn-calc" onclick="calculate()">🧮 คำนวณสรุปยอด</button>

        <!-- 4. สรุปผล -->
        <div id="resultSection" class="hidden">
            <h3>📊 สรุปยอดต้องโอน (หักลบหนี้แล้ว)</h3>
            <div class="table-responsive">
                <table id="resultTable">
                    <thead>
                        <tr>
                            <th>คนโอน ➡️ คนรับ</th>
                            <th>ยอดเงิน (บ.)</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <button class="btn-line hidden" id="btnSendLine" onclick="sendToLine()">🟢 ส่งสรุปเข้าแชทกลุ่ม</button>
            <button class="btn-copy" onclick="copyText()">📋 ก๊อปปี้ข้อความ</button>
            <textarea id="summaryText" rows="10" readonly></textarea>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
